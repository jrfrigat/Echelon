<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Echelon logo">
  <!-- Echelon mark: three ranks in echelon - each stepped back and committed after the one ahead of
       it. That is what the planner produces, a rollout in successive waves. Command Center palette:
       cyan #4fd6c9 -> accent #4ea1ff on #131416, as in Flare and Weir. -->
  <defs>
    <linearGradient id="echEdge" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fd6c9"/>
      <stop offset="1" stop-color="#4ea1ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="28" fill="#131416"/>
  <rect x="2.8" y="2.8" width="122.4" height="122.4" rx="25.6" fill="none" stroke="#26282b" stroke-width="4.8"/>

  <!-- The leading rank is solid and full width; each following one is shorter and stepped back, so
       the order reads left to right even at 16px. -->
  <g fill="url(#echEdge)">
    <rect x="30" y="34" width="68" height="14" rx="7"/>
    <rect x="30" y="57" width="50" height="14" rx="7" opacity="0.72"/>
    <rect x="30" y="80" width="32" height="14" rx="7" opacity="0.46"/>
  </g>

  <!-- The gate every rank waits at before it moves. -->
  <rect x="20" y="30" width="5" height="68" rx="2.5" fill="#4fd6c9"/>
</svg>
