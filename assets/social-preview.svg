<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Echelon - deploy a task, not a branch">
  <!-- GitHub social preview (1280x640). Same mark and palette as the banner, laid out for a card
       that is usually seen small: one line of name, one of promise, nothing else competing. -->
  <defs>
    <linearGradient id="spPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181a"/>
      <stop offset="1" stop-color="#0e0f10"/>
    </linearGradient>
    <linearGradient id="spMarkEdge" x1="576" y1="120" x2="832" y2="376" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fd6c9"/>
      <stop offset="1" stop-color="#4ea1ff"/>
    </linearGradient>
    <linearGradient id="spText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd6c9"/>
      <stop offset="1" stop-color="#4ea1ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="640" fill="url(#spPanel)"/>

  <g transform="translate(512,120)">
    <rect x="0" y="0" width="256" height="256" rx="56" fill="#131416"/>
    <rect x="5.6" y="5.6" width="244.8" height="244.8" rx="51.2" fill="none" stroke="#26282b" stroke-width="9.6"/>

    <g fill="url(#spMarkEdge)">
      <rect x="60" y="68" width="136" height="28" rx="14"/>
      <rect x="60" y="114" width="100" height="28" rx="14" opacity="0.72"/>
      <rect x="60" y="160" width="64" height="28" rx="14" opacity="0.46"/>
    </g>
    <rect x="40" y="60" width="10" height="136" rx="5" fill="#4fd6c9"/>
  </g>

  <text x="640" y="452" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="78" font-weight="700" fill="url(#spText)">Echelon</text>
  <text x="640" y="504" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="30" font-weight="400" fill="#a3a3a8">Deploy a task, not a branch</text>
  <text x="640" y="552" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6d6d73">Rollout planning across trackers and repositories, on .NET 10</text>
</svg>
