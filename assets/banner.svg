<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-label="Echelon - deploy a task, not a branch">
  <defs>
    <linearGradient id="echPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181a"/>
      <stop offset="1" stop-color="#0f1011"/>
    </linearGradient>
    <!-- The mark's gradient lives in the logo box's user space: the group below is translated, so
         0..128 there maps onto the 128px badge. -->
    <linearGradient id="echMarkEdge" x1="36" y1="36" x2="164" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fd6c9"/>
      <stop offset="1" stop-color="#4ea1ff"/>
    </linearGradient>
    <linearGradient id="echText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd6c9"/>
      <stop offset="1" stop-color="#4ea1ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="200" rx="20" fill="url(#echPanel)"/>
  <rect x="1.5" y="1.5" width="757" height="197" rx="18.5" fill="none" stroke="#26282b" stroke-width="3"/>

  <g transform="translate(36,36)">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#131416"/>
    <rect x="2.8" y="2.8" width="122.4" height="122.4" rx="25.6" fill="none" stroke="#26282b" stroke-width="4.8"/>

    <g fill="url(#echMarkEdge)">
      <rect x="30" y="34" width="68" height="14" rx="7"/>
      <rect x="30" y="57" width="50" height="14" rx="7" opacity="0.72"/>
      <rect x="30" y="80" width="32" height="14" rx="7" opacity="0.46"/>
    </g>
    <rect x="20" y="30" width="5" height="68" rx="2.5" fill="#4fd6c9"/>
  </g>

  <text x="210" y="98" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="62" font-weight="700" fill="url(#echText)">Echelon</text>
  <text x="213" y="132" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="#a3a3a8">Deploy a task, not a branch</text>
  <text x="213" y="159" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#6d6d73">Rollout planning across trackers and repositories, on .NET 10</text>
</svg>
