name: CI

# Build + test + dependency audit on every push/PR.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test & audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # MinVer reads the tags to derive the version. A shallow clone has none, so the build
          # would carry a version that matches nothing a release produces.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Echelon.slnx

      - name: Build (Release)
        run: dotnet build Echelon.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Echelon.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

  audit:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Developer machines here sit behind a proxy that blocks nuget.org, so the audit degrades to
      # a warning locally (see Directory.Build.props). CI has network, so this is where it must
      # actually bite.
      #
      # `dotnet list package --vulnerable` exits 0 even when it finds something - the flag reports,
      # it does not gate. The output has to be inspected, or the step passes while shipping a known
      # CVE. This is exactly how System.Security.Cryptography.Xml 9.0.5 (two high-severity
      # advisories, reached through DataProtection, which encrypts the VCS tokens) went unnoticed.
      - name: Audit dependencies
        run: |
          set -euo pipefail
          dotnet restore Echelon.slnx
          dotnet list Echelon.slnx package --vulnerable --include-transitive \
            | tee audit.txt
          if grep -qiE '\b(Critical|High|Moderate|Low)\b' audit.txt; then
            echo "::error::Vulnerable packages found - see the table above."
            exit 1
          fi
          echo "No vulnerable packages."

  migrations:
    name: Migrations match the model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      # dotnet-ef builds the project itself but does not restore it first, and says so obscurely:
      # "Assets file obj/project.assets.json not found". It only shows on a clean checkout, which is
      # why this passed on a developer machine, where obj/ already existed, and failed on the first
      # CI run after publication.
      - name: Restore
        run: dotnet restore Echelon.slnx

      # Editing an entity without adding a migration compiles, tests green, and then fails at
      # deployment against a schema that does not match - or worse, does not fail, and the column
      # is quietly missing. No database needed: this compares the model to the snapshot.
      #
      # Both providers, because a migration is per-provider: adding a column and remembering only
      # SQL Server leaves PostgreSQL deployments broken, and nothing else would say so.
      - name: No pending model changes
        run: |
          set -euo pipefail
          for project in MsSql Postgres; do
            for context in AppDbContext ArchiveDbContext; do
              echo "::group::$project / $context"
              dotnet ef migrations has-pending-model-changes \
                --project "src/Echelon.Migrations.$project" \
                --context "$context"
              echo "::endgroup::"
            done
          done

      # The SQL is where the two databases actually differ, and a filter or a system column that is
      # wrong scaffolds happily and fails only when applied. Generating it needs no server.
      - name: Migrations script generates for both providers
        run: |
          set -euo pipefail
          for project in MsSql Postgres; do
            for context in AppDbContext ArchiveDbContext; do
              dotnet ef migrations script --idempotent \
                --project "src/Echelon.Migrations.$project" \
                --context "$context" \
                -o "/tmp/$project-$context.sql"
            done
          done
          # PostgreSQL has no bracket quoting; a stray one means SQL Server's dialect leaked in.
          if grep -q '\[' /tmp/Postgres-*.sql; then
            echo "::error::SQL Server bracket quoting reached the PostgreSQL script."
            exit 1
          fi

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Empty files named after code fragments ("_success", "t.ClosedAt") are the residue of stray
      # shell redirects and have reached commits repeatedly. Cheap to catch, confusing to inherit.
      # The check used to fail exactly when the repository was CLEAN. Its loop ended on
      # `[ -n "$f" ] && ...`, which is false for the empty line `read` produces from an empty list,
      # so the loop exited 1, the command substitution carried that out, and `set -e` failed the
      # step - reporting nothing, because the error branch was never reached. It went unnoticed
      # until the first run on a repository with no empty files, which was the first run ever.
      - name: No committed empty files
        run: |
          set -euo pipefail
          tracked_empty=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              tracked_empty="${tracked_empty}${f}"$'\n'
            fi
          done <<< "$(find . -path ./.git -prune -o -type f -empty -print | grep -v '/obj/\|/bin/' || true)"
          if [ -n "$tracked_empty" ]; then
            echo "::error::Empty files are committed:"
            echo "$tracked_empty"
            exit 1
          fi
          echo "No committed empty files."
